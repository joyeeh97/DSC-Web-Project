<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position_실습2_absolute</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body{
            padding: 20px;
        }

        /*부모 박스 스타일 적용*/
        div.parent{
            border: 2px solid #dbc3c7;
            width: 300px;
            height: 200px;
            background-color: #ecf0f1;
            margin: 20px auto;

            position: relative; /*부모에 속성을 줄 때는 현위치 값을 0,0 relative로*/
        }

        div.child{
            width: 60px;
            height: 60px;
            color: white;
            font-size: 12px;
            text-align: center;
            line-height: 60px;
            border-radius: 5px;

            position: absolute; /*자식들에게 0,0을 잡아주는 스타일(absolute) 적용*/
        }

        div.top-left{
            top: 0px;
            left: 0px;
            background-color: #3498db;
        }

        div.top-right{
            top: 0px;
            right: 0px;
            background-color: #e74c3c;
        }

        div.bottom-left{
            bottom: 0px;
            left: 0px;
            background-color: #2ecc71;
        }

        div.bottom-right{
            bottom: 0px;
            right: 0px;
            background-color: #f39c12;
        }

        /*요소(태그)를 정중앙으로 이동하고자 할 때 공식*/
        div.center{
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #9b59b6;
        }
    </style>
</head>
<body>
    <h2>absolute 위치 확인</h2>
    <div class="parent">
        <div class="child top-left">좌상</div>
        <div class="child top-right">우상</div>
        <div class="child center">중앙</div>
        <div class="child bottom-left">좌하</div>
        <div class="child bottom-right">우하</div>
    </div>
</body>
</html>
